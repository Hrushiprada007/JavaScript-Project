<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript - Form</title>
    <script>
        function bodyload(){
            // window.document.images[0].src="../public/images/laptop.jpg";
            // window.document.forms[0].elements[1].value ="Register";
            // window.document.forms[1].elements[1].value ="Login";
           
            //reference by name
           
            pic.src="../public/images/laptop.jpg";
            frmRegister.btnRegister.value="Register";
            frmLogin.btnLogin.value="Login";

        }
    </script>
</head>
<body onload="bodyload()">

    <div>
        <form name="frmLogin">
            <h2>Login</h2>

        </form>
